<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SerijaStar – platforma za ocenjivanje TV serija.">
  <meta name="keywords" content="serije, ocenjivanje, TV epizode, SerijaStar">
  <meta name="author" content="SerijaStar Tim">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="SerijaStar – Prijava">
  <meta property="og:type" content="website">
  <link rel="icon" href="slike/logo-64.png" type="image/png">
  <title>SerijaStar – Prijava</title>
  <link rel="stylesheet" href="css/stil.css">
  <link rel="stylesheet" href="css/prijava.css">
</head>
<body>

<!-- Pristupačnost: tema i font -->
<div class="acc-prijava">
  <button class="dugme-acc" id="dug-tema" onclick="togglujTemu()" title="Promeni temu">
    <span class="lucide-ikona" id="tema-ikona"><i data-lucide="sun"></i></span>
  </button>
  <button class="dugme-acc" onclick="povecajFont()" title="Povećaj font">A+</button>
  <button class="dugme-acc" onclick="smanjiFont()"  title="Smanji font">A-</button>
</div>

<!-- Čestice u pozadini -->
<div id="cestice-k"></div>

<!-- PRIJAVA KARTICA -->
<div class="prijava-kartica">

  <!-- Logo -->
  <div class="logo-z">
    <div class="logo-ikona-k" aria-label="SerijaStar logo">
      <span class="lucide-ikona"><i data-lucide="film"></i></span>
    </div>
    <div class="logo-n">SerijaStar</div>
    <div class="logo-pod">Ocenjivanje serija</div>
  </div>

  <div class="linija-razdvajac"></div>

  <!-- Tabovi -->
  <div class="tab-nav" role="tablist" aria-label="Izbor uloge">
    <button class="tab-dugme ak" role="tab" aria-selected="true"
      onclick="prikaziTab('admin')" id="tb-admin">
      <span class="ik"><span class="lucide-ikona"><i data-lucide="shield-check"></i></span></span>
      Admin
    </button>
    <button class="tab-dugme" role="tab" aria-selected="false"
      onclick="prikaziTab('user')" id="tb-user">
      <span class="ik"><span class="lucide-ikona"><i data-lucide="user"></i></span></span>
      Korisnik
    </button>
  </div>

  <!-- Greška -->
  <div class="greska-poruka" id="greska" role="alert" aria-live="polite"></div>

  <!-- Admin forma -->
  <div class="tab-sadrzaj vidljiv-blok" id="tab-admin" role="tabpanel">
    <div class="polje-g">
      <label for="a-korisnicko">Korisničko ime</label>
      <input type="text" id="a-korisnicko" placeholder="Admin"
        autocomplete="off" onkeydown="if(event.key==='Enter')prijava()"
        aria-required="true">
    </div>
    <div class="polje-g">
      <label for="a-lozinka">Lozinka</label>
      <input type="password" id="a-lozinka" placeholder="••••••"
        onkeydown="if(event.key==='Enter')prijava()"
        aria-required="true">
    </div>
    <button class="dugme-prijava" onclick="prijava()" aria-label="Prijavi se kao administrator">
      <span class="lucide-ikona"><i data-lucide="log-in"></i></span>
      Prijavi se kao Admin
    </button>
  </div>

  <!-- Korisnik forma -->
  <div class="tab-sadrzaj" id="tab-user" role="tabpanel">
    <div class="polje-g">
      <label for="u-korisnicko">Korisničko ime</label>
      <input type="text" id="u-korisnicko" placeholder="User"
        autocomplete="off" onkeydown="if(event.key==='Enter')prijava()"
        aria-required="true">
    </div>
    <div class="polje-g">
      <label for="u-lozinka">Lozinka</label>
      <input type="password" id="u-lozinka" placeholder="••••••"
        onkeydown="if(event.key==='Enter')prijava()"
        aria-required="true">
    </div>
    <button class="dugme-prijava" onclick="prijava()" aria-label="Prijavi se kao korisnik">
      <span class="lucide-ikona"><i data-lucide="log-in"></i></span>
      Prijavi se kao Korisnik
    </button>
  </div>

  <!-- Demo info -->
  <div class="demo-z">
    Admin: <strong>Admin / Admin</strong> &nbsp;·&nbsp; Korisnik: <strong>User / User</strong><br>
    <em>Nove korisnike dodaje Admin u svom panelu (čuvaju se u localStorage)</em>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/prijava.js"></script>
</body>
</html>
